name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test

  migrate-production:
    needs: laravel-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'RezaAmru/salon-wellnes-app'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: salon-production-database
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Migrate production database
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_KEY: ${{ secrets.APP_KEY }}
          LOG_CHANNEL: stderr
          SESSION_DRIVER: array
          CACHE_STORE: array
          DB_CONNECTION: ${{ vars.DB_CONNECTION || 'pgsql' }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_SSLMODE: ${{ vars.DB_SSLMODE || 'require' }}
        run: |
          : "${APP_KEY:?APP_KEY secret is missing}"
          : "${DB_URL:?DB_URL secret is missing}"
          php artisan migrate --force --no-interaction
