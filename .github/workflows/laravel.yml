name: Laravel CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - name: Copy environment file
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Generate application key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Run Laravel tests
        run: php artisan test

  migrate-production:
    needs: laravel-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'RezaAmru/salon-wellnes-app'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: salon-production-database
      cancel-in-progress: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Migrate production database
        env:
          APP_ENV: production
          APP_DEBUG: "false"
          APP_KEY: ${{ secrets.APP_KEY }}
          LOG_CHANNEL: stderr
          SESSION_DRIVER: array
          CACHE_STORE: array
          DB_CONNECTION: mysql
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ATTR_SSL_CA: /etc/ssl/certs/ca-certificates.crt
        run: |
          : "${APP_KEY:?APP_KEY secret is missing}"
          : "${DB_HOST:?DB_HOST secret is missing}"
          : "${DB_PORT:?DB_PORT secret is missing}"
          : "${DB_DATABASE:?DB_DATABASE secret is missing}"
          : "${DB_USERNAME:?DB_USERNAME secret is missing}"
          : "${DB_PASSWORD:?DB_PASSWORD secret is missing}"
          php artisan migrate --force --no-interaction
